name: Iris ML API - CI Pipeline - CSE

# Define when GitHub Actions should run this workflow
on:
# Run CI whenever code is pushed to main branch
  push:
    branches:
      - main


  pull_request:
    branches:
      - main


# permissions are restricted to read-only for security reasons
permissions:
    contents: read
    packages: write

# define the jobs that will run as part of this workflow
jobs: 
  # Job 1: Test
    test:
        # Github repo provides a fresh Ubuntu virtual environment for this job
        name: Run API tests
        runs-on: ubuntu-latest

        steps:
            # Step-1: Download the repo content to the runner
            # Without this step, the runner will not have access to the code in the repo
            - name: Check out repository
              uses: actions/checkout@v4

            # Step-2: Set up Python environment
            - name: Set up Python 3.14
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            # Step - 3: Install Python dependencies
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            # Step - 4 : Execute the automated tests
            - name: Run automated tests
              run: python -m pytest -v
 # Step - 5 : Build and publish the Docker image
  build and publish:          
            - name: Build and publish Docker image
              # This job starts only if all the tests pass successfully
              needs: test
              runs-on: ubuntu-latest

              # Publish only when code is pushed to main branch
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              steps:
                # Download repo source code to the runner
                - name: Check out Source Code
                  uses: actions/checkout@v4

                # Enable docker Buildkit functionality for faster builds
                - name: Setup Docker Buildx
                  uses: docker/setup-buildx-action@v2

                # Authrnticate with GHCR
                - name: Login to GHCR
                  uses: docker/login-action@v2
                  with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

                # Generate images names and tags
                - name: Generate Docker metadata
                  id: meta
                  uses: docker/metadata-action@v5
                  with:
                    images: ghcr.io/${{ github.repository }}
                    tags: |
                      type=raw, value=latest
                      type=sha, format=short
                      
                # Build and push the Docker image to GHCR
                - name: Build and push Docker image
                  uses: docker/build-push-action@v5
                  with:
                    context: .
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}

              run: docker build -t iris-ml-api:${{ github.sha }} .